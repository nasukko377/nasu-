<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL - ONLINE</title>
    <style>
        body { background-color: #050505; color: #39ff14; font-family: 'Courier New', monospace; padding: 40px; }
        .console { border: 1px solid #39ff14; padding: 20px; box-shadow: 0 0 15px rgba(57, 255, 20, 0.4); border-radius: 5px; background: rgba(0,0,0,0.8); max-width: 700px; margin: 0 auto; }
        h1 { font-size: 2rem; border-bottom: 1px solid #39ff14; padding-bottom: 10px; margin-top: 0; }
        #typing { font-size: 1.2rem; white-space: pre-wrap; display: inline; }
        .cursor { display: inline-block; width: 10px; height: 20px; background-color: #39ff14; animation: blink 1s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="console">
        <h1>[SYSTEM STATUS: ONLINE]</h1>
        <div id="typing"></div><span class="cursor"></span>
    </div>

    <script>
        const text = ">> 秘密のデジタルベースへようこそ...\n>> Chromebookのi-FILTERの裏側でシステムが起動しました。\n>> 残り半年の相棒と一緒に、ここから面白いソフトウェアやコードをたくさん実験していくぜ。\n>> ACCESS GRANTED.";
        let index = 0;
        function typeEffect() {
            if (index < text.length) {
                document.getElementById("typing").textContent += text.charAt(index);
                index++;
                setTimeout(typeEffect, 70);
            }
        }
        window.onload = typeEffect;
    </script>
</body>
</html>
